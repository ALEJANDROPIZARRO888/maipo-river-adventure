<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2d3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maipo River">
<title>Maipo River — Equipo</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f2f3; --ink:#1d1f20; --accent:#5980a6; --accent7:#2f5478; --deep:#1d2d3d; --line:#c9ccd0; --muted:#5b6167; --ok:#1e6b3a; --bad:#a12727; --warn:#8a5a00; --tint:#e8eef4; }
  * { box-sizing:border-box; border-radius:0; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.4 Barlow,system-ui,sans-serif; }
  body { padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
  h1,h2,h3 { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; margin:0; letter-spacing:.01em; }
  h1 { font-size:30px; font-weight:700; } h2 { font-size:22px; font-weight:700; margin:18px 0 8px; } h3 { font-size:18px; font-weight:600; }
  button,input,select,textarea { font:500 15px Barlow,sans-serif; min-height:46px; padding:0 12px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  textarea { padding:10px 12px; width:100%; min-height:80px; }
  input,select { max-width:100%; }
  button { background:var(--accent); color:#fff; border:0; font:600 15px 'Barlow Condensed'; text-transform:uppercase; letter-spacing:.06em; cursor:pointer; padding:0 16px; }
  button.ghost { background:none; color:var(--deep); border:1px solid var(--line); }
  button.ok { background:var(--ok); } button.bad { background:none; color:var(--bad); border:1px solid var(--bad); }
  button:disabled { opacity:.45; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent7); }
  main { max-width:620px; margin:0 auto; padding:0 14px 20px; }
  header { position:sticky; top:0; z-index:5; background:var(--deep); color:#f2f2f3; padding:calc(8px + env(safe-area-inset-top)) 14px 8px; display:flex; align-items:center; gap:10px; }
  header .marca { font:700 19px 'Barlow Condensed'; text-transform:uppercase; letter-spacing:.04em; flex:1; line-height:1.1; }
  header .marca small { display:block; font:500 11px Barlow; letter-spacing:.08em; opacity:.75; }
  .vivo { font:600 11px Barlow; text-transform:uppercase; letter-spacing:.08em; display:flex; align-items:center; gap:5px; }
  .vivo i { width:8px; height:8px; background:#4ade80; display:inline-block; } .vivo.off i { background:#f59e0b; }
  .ib { min-height:44px; min-width:44px; padding:0; background:none; color:#f2f2f3; border:1px solid #ffffff44; position:relative; font-size:15px; }
  .ib .n { position:absolute; top:-6px; right:-6px; background:var(--accent); color:#fff; font:700 11px Barlow; min-width:18px; height:18px; line-height:18px; text-align:center; padding:0 4px; }
  .av { background:var(--accent); font:700 16px 'Barlow Condensed'; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; background:var(--deep); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; color:#ffffffaa; border:0; border-top:3px solid transparent; min-height:60px; font:600 13px 'Barlow Condensed'; letter-spacing:.06em; padding:0 2px; position:relative; }
  nav button[aria-current=true] { color:#fff; border-top-color:var(--accent); }
  nav button .n { position:absolute; top:6px; margin-left:4px; background:var(--accent); color:#fff; font:700 10px Barlow; min-width:16px; height:16px; line-height:16px; padding:0 3px; }
  .card { position:relative; border:1px solid var(--line); padding:12px 14px; margin:16px 0; background:transparent; }
  .card::before,.card::after { content:'+'; position:absolute; font:500 14px/1 Barlow; color:var(--accent); }
  .card::before { top:-8px; left:-5px; } .card::after { bottom:-8px; right:-5px; }
  .card.acento { background:var(--tint); border-color:var(--accent); }
  .head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .head b { font:600 20px 'Barlow Condensed'; text-transform:uppercase; }
  .tag { font:600 11px Barlow; text-transform:uppercase; letter-spacing:.08em; color:var(--accent7); }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .row.between { justify-content:space-between; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .stat { border:1px solid var(--line); padding:8px 10px; } .stat b { display:block; font:700 28px 'Barlow Condensed'; line-height:1.1; }
  .bar { height:8px; background:#e2e4e7; margin-top:6px; } .bar i { display:block; height:100%; background:var(--accent); }
  .warn { background:#fff4d6; border:1px solid #e0c060; padding:8px 10px; margin:10px 0; }
  .err { background:#fbeaea; border:1px solid #d99; padding:8px 10px; margin:10px 0; color:var(--bad); font-weight:600; }
  .info { background:var(--tint); border:1px solid #b9c9da; padding:8px 10px; margin:10px 0; }
  label { display:block; font:600 12px Barlow; text-transform:uppercase; letter-spacing:.06em; margin:12px 0 4px; }
  form input,form select,form textarea { width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { min-height:40px; background:#fff; color:var(--deep); border:1px solid var(--line); font:600 13px Barlow; text-transform:none; letter-spacing:0; }
  .chip[aria-pressed=true] { background:var(--deep); color:#fff; border-color:var(--deep); }
  .pax { border-top:1px solid var(--line); padding:8px 0; }
  .pax:first-of-type { border-top:0; }
  .st-borrador,.st-asignado,.st-nueva { color:var(--warn); } .st-aceptado,.st-confirmada,.st-publicada,.st-cerrado,.st-pagado { color:var(--ok); }
  .st-rechazado,.st-cancelada,.st-suspendida { color:var(--bad); }
  .toast { position:fixed; left:14px; right:14px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:9; max-width:592px; margin:0 auto; background:var(--deep); color:#fff; padding:12px 14px; border-left:4px solid var(--accent); }
  .toast b { display:block; font:600 16px 'Barlow Condensed'; text-transform:uppercase; }
  dialog { border:1px solid var(--line); padding:16px; max-width:92vw; width:420px; }
  dialog::backdrop { background:#0008; }
  .center { max-width:420px; margin:0 auto; padding:24px 14px; }
  .logo { display:block; width:120px; margin:12px auto 4px; }
  .pill { display:inline-block; font:700 10px Barlow; letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; border:1px solid var(--accent); color:var(--accent7); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th,td { text-align:right; padding:6px 4px; border-top:1px solid var(--line); } th:first-child,td:first-child { text-align:left; }
  th { font:600 11px Barlow; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-top:0; }
  .off-banner { background:#f59e0b; color:#1d1f20; text-align:center; font:600 13px Barlow; padding:4px; }
</style>
</head>
<body>
<div id="raiz"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clp = n => '$' + Number(n || 0).toLocaleString('es-CL');
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fdate = f => { const [y, m, d] = String(f).slice(0, 10).split('-').map(Number); return DIAS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] + ' ' + d + ' ' + MES[m - 1]; };
const sumaDias = (f, n) => { const [y, m, d] = f.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const FN = { guia: 'Guía de balsa', seguridad: 'Kayak de seguridad', conductor: 'Conductor / fotógrafo' };
const FN_C = { guia: 'Guía', seguridad: 'Kayak', conductor: 'Conductor' };
const VER = { guia: 'Ver mi bote', seguridad: 'Ver mi kayak', conductor: 'Ver mi turno' };
const TRAMOS = { san_alfonso_melocoton: 'San Alfonso — Melocotón', melocoton_san_jose: 'Melocotón — San José', seccion_completa: 'Sección completa' };
const ESTADO = { borrador: 'sin enviar', asignado: 'esperando respuesta', aceptado: 'aceptó', rechazado: 'rechazó', cerrado: 'cerrado', pagado: 'pagado' };
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
  limpiar: () => { try { Object.keys(localStorage).filter(k => k.startsWith('mra_')).forEach(k => localStorage.removeItem(k)); } catch {} }
};

// ------------------------------------------------------------------ estado y API
const S = { token: store.get('mra_tok') || '', cuenta: null, vista: 'inicio', rev: -1, hoy: '', fecha: '', periodo: 'Semana', d: {}, equipo: [], avisos: 0, online: true, offline: false, error: '', clave: null, instalado: true, cargando: true };
const admin = () => S.cuenta && S.cuenta.tipo === 'admin';

async function pedir(method, url, body, opts = {}) {
  let r;
  try { r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(S.token && !opts.publico ? { Authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch { S.online = false; const e = new Error('Sin conexión'); e.sinRed = true; throw e; }
  S.online = true;
  if (r.status === 401 && !opts.publico) { salir(); throw new Error('Tu sesión terminó. Vuelve a entrar.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Error ' + r.status); e.datos = j; e.estado = r.status; throw e; }
  return j;
}
// Lecturas: si no hay señal se muestra lo último que se vio (útil en el río).
async function leer(url) {
  const k = 'mra_c_' + (S.cuenta ? S.cuenta.id : 0) + url;
  try { const j = await pedir('GET', url); store.set(k, JSON.stringify(j)); S.offline = false; return j; }
  catch (e) { if (e.sinRed) { const c = store.get(k); if (c) { S.offline = true; return JSON.parse(c); } } throw e; }
}
const get = (a, p = {}) => leer('/api/app?' + new URLSearchParams({ a, ...p }));
const post = (accion, body = {}) => pedir('POST', '/api/app', { accion, ...body });

function salir() {
  S.token = ''; S.cuenta = null; S.d = {}; S.equipo = []; S.rev = -1; store.limpiar(); render();
}

// ------------------------------------------------------------------ utilidades de UI
let toastT;
function aviso(titulo, texto = '') {
  const t = $('#toast'); t.innerHTML = `<b>${esc(titulo)}</b>${esc(texto)}`; t.hidden = false;
  try { navigator.vibrate && navigator.vibrate(60); } catch {}
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5000);
}
// Cuadro propio en vez de prompt()/confirm() del navegador (se ve mal y a veces se bloquea en apps instaladas).
function dialogo({ titulo, texto = '', campo = null, si = 'Aceptar', no = 'Cancelar', lista = null }) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog"><h3>${esc(titulo)}</h3>${texto ? `<p>${esc(texto)}</p>` : ''}
      ${lista ? `<ul>${lista.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${campo ? `<label>${esc(campo)}</label><textarea id="dlgv" maxlength="300"></textarea>` : ''}
      <div class="row"><button value="si" type="submit">${esc(si)}</button>${no ? `<button class="ghost" value="no" type="submit">${esc(no)}</button>` : ''}</div></form>`;
    d.onclose = () => res(d.returnValue === 'si' ? (campo ? ($('#dlgv') ? $('#dlgv').value : '') : true) : null);
    d.showModal();
  });
}
const errorTxt = e => e.sinRed ? 'Sin conexión: no se pudo guardar. Intenta de nuevo cuando vuelva la señal.' : e.message;
async function ejecutar(fn, okMsg) {
  S.error = '';
  try { const r = await fn(); if (okMsg) aviso(okMsg); await refrescar(true); return r; }
  catch (e) { S.error = errorTxt(e); render(); return null; }
}

// ------------------------------------------------------------------ carga por vista
const rango = p => {
  const h = S.hoy;
  if (p === 'Día') return [h, h];
  const [y, m, d] = h.split('-').map(Number);
  if (p === 'Semana') { const dow = (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; const ini = sumaDias(h, -dow); return [ini, sumaDias(ini, 6)]; }
  return [new Date(Date.UTC(y, m - 1, 1)).toISOString().slice(0, 10), new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)];
};
async function cargarVista() {
  const v = S.vista, d = S.d;
  if (v.startsWith('turno:')) { d.turno = await get('turno', { id: v.slice(6) }); return; }
  if (admin()) {
    if (v === 'inicio') { [d.dia, d.avisos] = await Promise.all([get('dia', { fecha: S.hoy }), get('avisos')]); }
    else if (v === 'armar') { [d.dia, S.equipo] = await Promise.all([get('dia', { fecha: S.fecha }), get('equipo').then(x => x.equipo)]); }
    else if (v === 'reservas') d.reservas = (await leer('/api/reservas')).reservas;
    else if (v === 'equipo') S.equipo = (await get('equipo')).equipo;
    else if (v === 'pagos') { const [a, b] = rango(S.periodo); d.pagos = await get('pagos', { desde: a, hasta: b }); }
    else if (v === 'avisos') d.avisos = await get('avisos');
  } else {
    if (v === 'inicio') {
      const [a, b] = rango(S.periodo);
      [d.turnos, d.periodo] = await Promise.all([get('turnos', { desde: S.hoy, hasta: sumaDias(S.hoy, 30) }), get('turnos', { desde: a, hasta: b })]);
    } else if (v === 'agenda') d.turnos = await get('turnos', { desde: S.hoy, hasta: sumaDias(S.hoy, 30) });
    else if (v === 'pagos') { const [a, b] = rango(S.periodo); d.periodo = await get('turnos', { desde: a, hasta: b }); }
    else if (v === 'avisos') d.avisos = await get('avisos');
  }
}
const editando = () => { const a = document.activeElement; return a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) && a.closest('#vista'); };
let pendiente = false;
async function refrescar(forzar) {
  if (!S.token) return;
  try {
    const y = await get('yo');
    S.cuenta = y.cuenta; S.hoy = y.hoy; if (!S.fecha) S.fecha = y.hoy;
    if (y.avisos > S.avisos && S.avisos >= 0 && S.vista !== 'avisos') {
      const u = (await get('avisos')).avisos.find(a => !a.leido); if (u) aviso(u.titulo, u.cuerpo || '');
    }
    S.avisos = y.avisos; S.rev = y.rev;
    await cargarVista();
  } catch (e) { if (!e.sinRed) S.error = errorTxt(e); }
  S.cargando = false;
  if (!forzar && editando()) { pendiente = true; return; }
  render();
}
async function pulso() {
  if (!S.token || document.hidden) return;
  try {
    const { rev } = await pedir('GET', '/api/app?a=rev');
    if (rev !== S.rev) await refrescar(false);
    else if (!S.online) render();
    S.online = true; ponerVivo();
  } catch { S.online = false; ponerVivo(); }
}
function ponerVivo() { const v = $('.vivo'); if (v) { v.classList.toggle('off', !S.online); v.lastChild.textContent = S.online ? 'En vivo' : 'Sin conexión'; } }
setInterval(pulso, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pulso(); });
document.addEventListener('focusout', () => { if (pendiente) { pendiente = false; setTimeout(() => { if (!editando()) refrescar(true); }, 50); } });

// ------------------------------------------------------------------ vistas
function cabecera() {
  const c = S.cuenta, ini = c.nombre.split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  return `<header><div class="marca">Maipo River<small>${admin() ? 'Administración' : (c.funciones || []).map(f => FN_C[f]).join(' · ')} · ${esc(c.nombre.split(' ')[0])}</small></div>
    <span class="vivo${S.online ? '' : ' off'}"><i></i>${S.online ? 'En vivo' : 'Sin conexión'}</span>
    <button class="ib av" data-a="ir" data-v="perfil" aria-label="Mi perfil">${esc(ini)}</button></header>${S.offline ? '<div class="off-banner">Sin señal: mostrando lo último que viste</div>' : ''}`;
}
function menu() {
  const items = admin() ? [['inicio', 'Inicio'], ['armar', 'Armar'], ['reservas', 'Reservas'], ['equipo', 'Equipo'], ['pagos', 'Pagos']]
    : [['inicio', 'Inicio'], ['agenda', 'Agenda'], ['pagos', 'Pagos'], ['avisos', 'Avisos']];
  const base = S.vista.startsWith('turno:') ? 'inicio' : S.vista;
  const badge = S.avisos ? `<span class="n">${S.avisos}</span>` : '';
  return `<nav>${items.map(([v, t]) => `<button data-a="ir" data-v="${v}" aria-current="${base === v}">${t}${(v === 'avisos' || (admin() && v === 'inicio')) ? badge : ''}</button>`).join('')}</nav>`;
}
const errBox = () => S.error ? `<div class="err" role="alert">${esc(S.error)}</div>` : '';

function vInicioAdmin() {
  const d = S.d.dia; if (!d) return '<p class="muted">Cargando…</p>';
  const r = d.resumen, av = (S.d.avisos ? S.d.avisos.avisos : []).slice(0, 6);
  return `<h1>Hoy · ${esc(fdate(S.hoy))}</h1>
    <div class="stats"><div class="stat"><b>${r.salidas}</b><span class="muted">${r.salidas === 1 ? 'salida' : 'salidas'}</span></div><div class="stat"><b>${r.pasajeros}</b><span class="muted">reservados</span></div><div class="stat"><b>${r.fichas}</b><span class="muted">fichas</span></div></div>
    ${d.reservasNuevas ? `<div class="info"><b>${plural(d.reservasNuevas, 'reserva nueva', 'reservas nuevas')}</b> por confirmar. <a href="#" data-a="ir" data-v="reservas">Ver reservas</a></div>` : ''}
    <h2>Salidas de hoy</h2>
    ${d.salidas.length ? d.salidas.map(s => { const acp = s.puestos.filter(p => p.turno && p.turno.estado === 'aceptado').length, tot = s.puestos.filter(p => p.turno).length;
      return `<div class="card"><div class="head"><b>${esc(s.horario)} · ${esc(s.tramoEtiqueta || (Object.keys(s.porTramo).length > 1 ? 'Salida mixta' : 'Tramo por confirmar'))}</b><span class="tag st-${esc(s.estado)}">${esc(s.estado)}</span></div>
        <div>${plural(s.reservadas, 'persona', 'personas')} de ${s.cupo} · ${plural(s.fichas, 'ficha llena', 'fichas llenas')}</div>
        <div class="bar"><i style="width:${Math.min(100, s.reservadas / s.cupo * 100)}%"></i></div>
        <div class="muted small">Equipo: ${tot ? `${acp} de ${tot} aceptaron` : 'sin asignar'}</div>
        <div class="row"><button data-a="armarDia" data-f="${esc(S.hoy)}">Armar</button></div></div>`; }).join('') : '<p class="muted">No hay salidas hoy: aparecen solas cuando llegan reservas de rafting.</p>'}
    <h2>Avisos</h2>
    ${av.length ? av.map(avisoHtml).join('') : '<p class="muted">Sin avisos por ahora.</p>'}
    ${S.d.avisos && S.d.avisos.avisos.length > 6 ? '<div class="row"><button class="ghost" data-a="ir" data-v="avisos">Ver todos</button></div>' : ''}`;
}
function avisoHtml(a) {
  return `<div class="card ${a.leido ? '' : 'acento'}"><div class="head"><b>${esc(a.titulo)}</b><span class="tag">${esc(new Date(a.creada).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Santiago' }))}</span></div>
    ${a.cuerpo ? `<div class="muted">${esc(a.cuerpo)}</div>` : ''}${a.leido ? '' : `<div class="row"><button class="ghost" data-a="leido" data-id="${a.id}">Marcar leído</button></div>`}</div>`;
}
function vAvisos() {
  const l = S.d.avisos ? S.d.avisos.avisos : [];
  return `<h1>Avisos</h1>${l.some(a => !a.leido) ? '<div class="row"><button class="ghost" data-a="leidoTodos">Marcar todo como leído</button></div>' : ''}
    ${l.length ? l.map(avisoHtml).join('') : '<p class="muted">Sin avisos.</p>'}`;
}

// ---- Armar (admin)
function selPersonal(s, p) {
  const t = p.turno, otros = new Set(s.puestos.filter(x => x.turno && x.puesto !== p.puesto).map(x => x.turno.trabajador_id));
  const ops = S.equipo.filter(c => c.tipo === 'trabajador' && c.activa && c.funciones.includes(p.funcion));
  const bloqueado = t && ['cerrado', 'pagado'].includes(t.estado);

    const ps = d.pasajeros || [], pres = ps.filter(f => f.presente).length;
    cuerpo = `<h2>Mis pasajeros · check-in ${pres}/${ps.length}</h2>${ps.length ? ps.map(f => `<details class="pax"><summary style="min-height:44px;display:flex;align-items:center;gap:8px"><input type="checkbox" data-c="checkin" data-fid="${f.id}" style="min-height:auto;width:24px;height:24px"${f.presente ? ' checked' : ''}${cerrado ? ' disabled' : ''} aria-label="Llegó ${esc(f.nombre)}"><span><b>${esc(f.nombre)}</b> <span class="muted small">${f.edad ?? '?'} años · ${esc(f.idioma || '')}</span><br><span class="tag">${chipsPax(f) || 'sin condiciones médicas'}</span></span></summary>
      <div class="small" style="padding:4px 0 8px 32px"><div><b>Emergencia:</b> ${esc(f.emergencia_nombre || '-')}</div><div><b>Médico:</b> ${esc(f.medico || '-')}</div>${f.menor && f.apoderado ? `<div><b>Apoderado:</b> ${esc(f.apoderado.nombre)} — ${esc(f.apoderado.rut)}</div>` : ''}<div><b>Contacto:</b> <a href="tel:${esc(f.telefono)}">${esc(f.telefono)}</a></div><div class="muted">${f.visitas > 1 ? f.visitas + 'ª bajada con nosotros · ya conoce la charla' : 'Primera vez · reforzar la charla'} · consentimiento firmado</div></div></details>`).join('')
      : '<p class="muted">El admin aún no distribuye los pasajeros de esta bajada.</p>'}`;
  } else if (t.funcion === 'seguridad') {
    cuerpo = `<h2>Balsas que cubro</h2>${(d.botes || []).length ? d.botes.map(b => `<div class="card"><div class="head"><b>${esc(b.nombre)}</b><span class="tag">${b.guia ? 'Guía ' + esc(b.guia) : 'sin guía'}</span></div>
      <div>${b.pax ? plural(b.pax, 'pasajero', 'pasajeros') : 'Sin distribuir todavía'} · ${b.medicos ? plural(b.medicos, 'condición médica', 'condiciones médicas') : 'sin condiciones médicas'} · ${b.menores ? plural(b.menores, 'menor a bordo', 'menores a bordo') : 'sin menores'}</div></div>`).join('') : '<p class="muted">Sin distribuir todavía · el admin aún no reparte esta salida.</p>'}`;
  } else {
    const m = d.manifiesto || [];
    cuerpo = `<h2>Manifiesto de traslado · ${m.length}</h2>${m.length ? m.map(f => `<div class="pax"><b>${esc(f.nombre)}</b> <span class="tag">${esc(f.bote || 'sin balsa')} · ${esc(f.idioma || '')}${f.menor ? ' · MENOR' : ''}${f.sabe_nadar === false ? ' · NO SABE NADAR' : ''}</span>${f.medico ? `<div class="muted small">${esc(f.medico)}</div>` : ''}</div>`).join('') : '<p class="muted">Aún no hay fichas para esta salida.</p>'}
      <div class="info small">Las fotos de regalo llegan en la próxima versión.</div>`;
  }
  let cierre;
  if (cerrado) cierre = `<div class="card acento"><b>Bajada cerrada</b><div>${plural(t.pax_finales ?? 0, 'pasajero', 'pasajeros')} · ${clp(t.tarifa)} ${t.estado === 'pagado' ? '· pagado' : 'a pagar'}</div></div>`;
  else if (listo) {
    const pres = (d.pasajeros || []).filter(f => f.presente).length, def = t.funcion === 'guia' ? (pres || (d.pasajeros || []).length) : (t.funcion === 'seguridad' ? d.totalPax : (d.manifiesto || []).length);
    cierre = `<h2>Cerrar ${t.funcion === 'conductor' ? 'traslado' : 'bajada'}</h2><form class="card" data-f="cerrar" data-id="${t.id}"><label>${t.funcion === 'guia' ? '¿Cuántos bajaron en tu balsa?' : t.funcion === 'seguridad' ? '¿Cuántos bajaron en la salida completa?' : '¿Cuántos pasajeros trasladaste?'}</label>
      <input name="pax" type="number" min="0" max="60" value="${def ?? 0}" inputmode="numeric" required><label>Incidentes (opcional)</label><textarea name="incidentes" maxlength="1000" placeholder="Sin novedades"></textarea>
      <div class="row"><button class="ok" type="submit">Cerrar y sumar al pago</button></div></form>`;
  } else cierre = '';
  return cab + checklist + cuerpo + equipo + cierre;
}

// ---- Perfil
function vPerfil() {
  const c = S.cuenta;
  return `<h1>${esc(c.nombre)}</h1><div class="muted">@${esc(c.usuario)} · ${admin() ? 'Administración' + (c.es_maestra ? ' · cuenta maestra' : c.verificada ? ' · verificada' : ' · sin verificar') : 'Trabajador'}</div>${errBox()}
    ${admin() && !c.verificada ? '<div class="warn">Tu cuenta admin no está verificada: no puedes publicar bajadas. La cuenta maestra debe verificarte en Equipo.</div>' : ''}
    <form class="card" data-f="perfil"><h3>Mis datos</h3>
      ${!admin() ? `<label>Funciones que puedo cumplir</label><div class="chips">${Object.keys(FN).map(f => `<label class="chip" style="display:inline-flex;align-items:center;gap:6px;margin:0;padding:0 10px;text-transform:none;letter-spacing:0;font-weight:600;font-size:13px"><input type="checkbox" name="fn" value="${f}" style="min-height:auto;width:auto"${(c.funciones || []).includes(f) ? ' checked' : ''}> ${esc(FN_C[f])}</label>`).join('')}</div>` : ''}
      <div class="grid2"><div><label>Teléfono</label><input name="telefono" value="${esc(c.telefono || '')}" inputmode="tel"></div><div><label>Correo</label><input name="correo" type="email" value="${esc(c.correo || '')}"></div></div>
      <label>Contraseña nueva (opcional, mínimo 8)</label><input name="password" type="password" autocomplete="new-password" minlength="8">
      <div class="row"><button type="submit">Guardar</button></div></form>
    <div class="row"><button class="ghost" data-a="salir">Cerrar sesión</button>${admin() ? '<a class="tag" href="/admin">Panel clásico</a>' : ''}</div>
    <p class="muted small">Para instalar: en el celular abre el menú del navegador y elige “Agregar a pantalla de inicio”.</p>`;
}

// ------------------------------------------------------------------ pantallas de acceso
function vLogin() {
  return `<div class="center"><img class="logo" src="/app/icon-192.png" alt="Maipo River Adventure"><h1 style="text-align:center">Equipo</h1><p class="muted" style="text-align:center">Ingresa con el usuario y la contraseña que te entregó el administrador.</p>
    ${errBox()}<form data-f="login"><label>Usuario</label><input name="usuario" autocomplete="username" autocapitalize="none" required><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required>
    <div class="row"><button type="submit" style="width:100%">Entrar</button></div></form></div>`;
}
function vInstalar() {
  return `<div class="center"><img class="logo" src="/app/icon-192.png" alt="Maipo River Adventure"><h1 style="text-align:center">Primera instalación</h1>
    <p>Esta es la primera vez que se abre el sistema. <b>La primera cuenta queda como cuenta maestra</b>: es la única que verifica a los otros socios y no se puede transferir sin confirmación.</p>${errBox()}
    <form data-f="instalar"><label>Clave del panel de reservas</label><input name="clave" type="password" required autocomplete="off"><div class="muted small">La misma que usas en maiporiveradventure.cl/admin. Así solo el dueño puede instalar.</div>
    <label>Nombre completo</label><input name="nombre" required autocomplete="name"><label>Correo</label><input name="correo" type="email" required autocomplete="email">
    <label>Contraseña (mínimo 8)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">
    <div class="row"><button type="submit" style="width:100%">Crear cuenta maestra</button></div></form></div>`;
}

// ------------------------------------------------------------------ render
function render() {
  const raiz = $('#raiz');
  if (S.cargando && S.token && !S.cuenta) { raiz.innerHTML = '<div class="center"><p class="muted" style="text-align:center">Cargando…</p></div>'; return; }
  if (!S.token || !S.cuenta) { raiz.innerHTML = S.instalado ? vLogin() : vInstalar(); return; }
  const v = S.vista;
  let cuerpo;
  if (v === 'perfil') cuerpo = vPerfil();
  else if (v === 'avisos') cuerpo = vAvisos();
  else if (v.startsWith('turno:')) cuerpo = vTurno();
  else if (admin()) cuerpo = ({ inicio: vInicioAdmin, armar: vArmar, reservas: vReservas, equipo: vEquipo, pagos: vPagosAdmin })[v]();
  else cuerpo = ({ inicio: vInicioTrab, agenda: vAgenda, pagos: vPagosTrab })[v]();
  const y = window.scrollY;
  raiz.innerHTML = cabecera() + `<main id="vista">${cuerpo}</main>` + menu();
  window.scrollTo(0, y);
  document.title = (S.avisos ? `(${S.avisos}) ` : '') + 'Maipo River — Equipo';
}
function ir(v) { S.vista = v; S.error = ''; if (v === 'armar' && !S.fecha) S.fecha = S.hoy; S.d = { ...S.d, dia: v === 'armar' ? null : S.d.dia }; window.scrollTo(0, 0); render(); refrescar(true); }

// ------------------------------------------------------------------ eventos
const A = {
  ir: el => ir(el.dataset.v),
  armarDia: el => { S.fecha = el.dataset.f; ir('armar'); },
  dia: el => { const n = +el.dataset.n; S.fecha = n === 0 ? S.hoy : sumaDias(S.fecha, n); S.d.dia = null; render(); refrescar(true); },
  periodo: el => { S.periodo = el.dataset.p; refrescar(true); },
  salir: () => salir(),
  copiar: async el => { try { await navigator.clipboard.writeText(el.dataset.t); aviso('Copiado'); } catch { aviso('No se pudo copiar', 'Selecciona el texto a mano.'); } },
  leido: el => ejecutar(() => post('leido', { id: +el.dataset.id })),
  leidoTodos: () => ejecutar(() => post('leido', { todos: true })),
  cerrarClave: () => { S.clave = null; render(); },
  auto: async el => {
    const r = await ejecutar(() => post('autodistribuir', { bajada_id: +el.dataset.sid }));
    if (r) aviso('Listo', `${plural(r.distribuidos, 'pasajero repartido', 'pasajeros repartidos')} · ${plural(r.asignados, 'puesto cubierto', 'puestos cubiertos')}${r.sinPersonal.length ? ' · falta: ' + r.sinPersonal.join(', ') : ''}${r.sobran ? ' · ' + plural(r.sobran, 'pasajero no cabe', 'pasajeros no caben') : ''}`);
  },
  publicar: async el => {
    const id = +el.dataset.sid;
    try {
      await post('publicar', { bajada_id: id }); aviso('Solicitudes enviadas', 'El equipo ya las recibió.'); await refrescar(true);
    } catch (e) {
      if (e.datos && e.datos.requiereConfirmar) {
        const si = await dialogo({ titulo: 'Antes de avisar al equipo', texto: 'Hay cosas por revisar. ¿Publicar igual?', lista: e.datos.avisos, si: 'Publicar igual', no: 'Volver' });
        if (si) await ejecutar(() => post('publicar', { bajada_id: id, forzar: true }), 'Solicitudes enviadas');
      } else { S.error = errorTxt(e); render(); }
    }
  },
  resp: async el => {
    const rechazar = el.dataset.r === 'rechazar';
    let motivo = '';
    if (rechazar) { motivo = await dialogo({ titulo: '¿No puedes esta bajada?', texto: 'Le avisamos al administrador para que busque un reemplazo.', campo: 'Motivo (opcional)', si: 'Enviar', no: 'Volver' }); if (motivo === null) return; }
    await ejecutar(() => post('responder', { turno_id: +el.dataset.id, respuesta: el.dataset.r, motivo }), rechazar ? 'Le avisamos al administrador' : 'Bajada aceptada');
    if (!rechazar && S.vista.startsWith('turno:')) render();
  },
  rsv: async el => {
    if (el.dataset.e === 'cancelada' && !(await dialogo({ titulo: `¿Cancelar la reserva de ${el.dataset.n}?`, texto: 'Se liberan sus cupos en la planilla.', si: 'Cancelar reserva', no: 'Volver' }))) return;
    await ejecutar(() => pedir('PATCH', '/api/reservas', { id: +el.dataset.id, estado: el.dataset.e }));
  },
  fn: async el => {
    const c = S.equipo.find(x => x.id === +el.dataset.id), f = el.dataset.f;
    const nuevas = c.funciones.includes(f) ? c.funciones.filter(x => x !== f) : [...c.funciones, f];
    if (!nuevas.length) { S.error = 'Debe tener al menos una función.'; render(); return; }
    await ejecutar(() => post('equipo_editar', { id: c.id, funciones: nuevas }));
  },
  baja: async el => {
    const on = el.dataset.on === '1';
    if (!on && !(await dialogo({ titulo: `¿Dar de baja a ${el.dataset.n}?`, texto: 'Pierde el acceso de inmediato, aunque tenga la app instalada.', si: 'Dar de baja', no: 'Volver' }))) return;
    await ejecutar(() => post('equipo_editar', { id: +el.dataset.id, activa: on }));
  },
  reset: async el => {
    if (!(await dialogo({ titulo: `¿Nueva clave para ${el.dataset.n}?`, texto: 'La clave anterior deja de servir.', si: 'Generar', no: 'Volver' }))) return;
    const r = await ejecutar(() => post('equipo_editar', { id: +el.dataset.id, reset_clave: true }));
    if (r && r.clave) { const c = S.equipo.find(x => x.id === +el.dataset.id); S.clave = { nombre: c.nombre, usuario: c.usuario, clave: r.clave, correoEnviado: false }; render(); window.scrollTo(0, 0); }
  },
  verificar: el => ejecutar(() => post('equipo_editar', { id: +el.dataset.id, verificada: el.dataset.on === '1' })),
  pagar: async el => {
    if (!(await dialogo({ titulo: `¿Marcar pagado a ${el.dataset.n}?`, texto: `${clp(el.dataset.m)} en bajadas cerradas de este período.`, si: 'Marcar pagado', no: 'Volver' }))) return;
    const [a, b] = rango(S.periodo);
    await ejecutar(() => post('pagar', { trabajador_id: +el.dataset.id, desde: a, hasta: b }), 'Pago registrado');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !A[el.dataset.a]) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.disabled) return; A[el.dataset.a](el);
});
document.addEventListener('change', async e => {
  const t = e.target, c = t.dataset.c; if (!c) return;
  if (c === 'fecha') { if (t.value) { S.fecha = t.value; S.d.dia = null; render(); refrescar(true); } return; }
  if (c === 'ck') { const id = t.dataset.id, l = new Set(marcas(id)); t.checked ? l.add(+t.dataset.i) : l.delete(+t.dataset.i); store.set('mra_ck_' + id, JSON.stringify([...l])); return; }
  if (c === 'puesto') return ejecutar(() => post('asignar', { bajada_id: +t.dataset.sid, puesto: t.dataset.p, trabajador_id: t.value ? +t.value : null }));
  if (c === 'bote') return ejecutar(() => pedir('PATCH', '/api/ficha', { id: +t.dataset.fid, bote_id: t.value ? +t.value : null }));
  if (c === 'asig') { if (t.value) return ejecutar(() => pedir('PATCH', '/api/ficha', { id: +t.dataset.fid, bajada_id: +t.value })); return; }
  if (c === 'checkin') return ejecutar(() => post('checkin', { ficha_id: +t.dataset.fid, presente: t.checked }));
});
document.addEventListener('submit', async e => {
  const f = e.target, k = f.dataset.f; if (!k) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), fn = new FormData(f).getAll('fn');
  S.error = '';
  try {
    if (k === 'login' || k === 'instalar') {
      const r = await pedir('POST', '/api/app', { accion: k === 'login' ? 'login' : 'setup', ...d }, { publico: true });
      S.token = r.token; S.cuenta = r.cuenta; store.set('mra_tok', r.token); S.vista = 'inicio'; S.fecha = ''; S.avisos = -1; S.cargando = true; S.instalado = true;
      await refrescar(true); return;
    }
    if (k === 'nuevoMiembro') {
      const r = await post('equipo_crear', { nombre: d.nombre, telefono: d.telefono, correo: d.correo, tipo: d.tipo || 'trabajador', funciones: fn });
      S.clave = { nombre: d.nombre, usuario: r.usuario, clave: r.clave, correoEnviado: r.correoEnviado }; await refrescar(true); window.scrollTo(0, 0); return;
    }
    if (k === 'perfil') {
      const b = { telefono: d.telefono, correo: d.correo }; if (d.password) b.password = d.password; if (!admin()) b.funciones = fn;
      const r = await post('perfil', b); if (r.token) { S.token = r.token; store.set('mra_tok', r.token); }
      S.cuenta = r.cuenta; aviso('Datos guardados'); await refrescar(true); return;
    }
    if (k === 'cerrar') {
      if (!(await dialogo({ titulo: '¿Cerrar la bajada?', texto: `${plural(+d.pax, 'pasajero', 'pasajeros')}. Después de cerrar cuenta para tu pago y no se puede editar.`, si: 'Cerrar', no: 'Volver' }))) return;
      await post('cerrar', { turno_id: +f.dataset.id, pax: +d.pax, incidentes: d.incidentes }); aviso('Bajada cerrada', 'Sumada a tu pago.'); await refrescar(true); return;
    }
  } catch (err) { S.error = errorTxt(err); render(); }
});

// ------------------------------------------------------------------ arranque
(async function () {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
  try { S.instalado = (await pedir('GET', '/api/app?a=instalado', null, { publico: true })).instalado; } catch {}
  if (S.token) { S.cargando = true; render(); await refrescar(true); if (!S.cuenta) render(); } else { S.cargando = false; render(); }
})();
</script>
</body>
</html>
